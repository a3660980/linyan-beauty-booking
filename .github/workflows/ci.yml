name: Check booking system
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run config:deploy
        env:
          CLOUDFLARE_D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
      - run: npx wrangler d1 migrations apply DB --local --config .deploy/wrangler.json
      - run: npx wrangler deploy --dry-run --config .deploy/wrangler.json --outdir .deploy/worker-check
