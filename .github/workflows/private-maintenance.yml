name: Private database maintenance
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare a short-lived encryption key or apply an encrypted request
        type: choice
        options: [prepare, apply]
        default: prepare
      request:
        description: Encrypted maintenance envelope only. Never enter personal data or SQL here.
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: private-database-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node scripts/private-maintenance.mjs
